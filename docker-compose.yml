services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: textdrop
      POSTGRES_PASSWORD: textdrop_dev
      POSTGRES_DB: textdrop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: